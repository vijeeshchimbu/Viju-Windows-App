name: Build Viju Trade Windows Stable

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v10-pc-base

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Windows app source
        shell: pwsh
        run: |
          python -m py_compile main.py
          python -m py_compile viju_trade_v10.py
          python -c "import ast, pathlib; ast.parse(pathlib.Path('main.py').read_text(encoding='utf-8')); print('main.py syntax OK')"
          @'
          import pathlib
          t = pathlib.Path("viju_trade_v10.py").read_text(encoding="utf-8")
          assert 'VERSION = "10.0"' in t
          assert 'SUPPORTED_BROKERS = ("DHAN",)' in t
          print("V10 engine validated")
          '@ | python -

      - name: Build stable portable Windows app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name Viju_Trade_PC --add-data "viju_trade_v10.py;." --hidden-import pandas --hidden-import requests --hidden-import pyotp --hidden-import logzero --hidden-import websocket --collect-all openai main.py

      - name: Verify portable EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\Viju_Trade_PC\Viju_Trade_PC.exe")) { throw "EXE not found" }
          Get-Item "dist\Viju_Trade_PC\Viju_Trade_PC.exe" | Format-List Name,Length,LastWriteTime
          Get-ChildItem "dist\Viju_Trade_PC" | Select-Object Name,Length | Format-Table -AutoSize

      - name: Upload stable portable app
        uses: actions/upload-artifact@v4
        with:
          name: Viju_Trade_PC_V10
          path: dist/Viju_Trade_PC/**
          if-no-files-found: error
