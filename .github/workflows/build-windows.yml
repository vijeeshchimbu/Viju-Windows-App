name: Build Viju Trade Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Windows app source
        shell: pwsh
        run: |
          python -m py_compile main.py
          python -c "import ast, pathlib; ast.parse(pathlib.Path('main.py').read_text(encoding='utf-8')); print('main.py syntax OK')"

      - name: Build Viju Trade PC EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Viju_Trade_PC --collect-all openai --collect-all logzero --hidden-import websocket main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\Viju_Trade_PC.exe")) { throw "EXE not found" }
          Get-Item "dist\Viju_Trade_PC.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Viju_Trade_PC_DHAN
          path: dist/Viju_Trade_PC.exe
          if-no-files-found: error
