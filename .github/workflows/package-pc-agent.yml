name: Package Viju Trade PC Agent V6.7

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source
        run: |
          grep -q 'APP_VERSION = "6.7"' main.py
          python -m py_compile main.py

      - name: Create package
        run: |
          mkdir -p Viju_Trade_PC_Agent_V6_7
          cp main.py Viju_Trade_PC_Agent_V6_7/main.py
          printf '@echo off\r\ncd /d "%%~dp0"\r\npython main.py\r\nif errorlevel 1 pause\r\n' > Viju_Trade_PC_Agent_V6_7/RUN_PC_AGENT.bat
          printf 'Viju_Trade PC Agent V6.7\nPython-only package - no EXE.\n\nUse with APK V11.10 and Python Engine V11.10.\n' > Viju_Trade_PC_Agent_V6_7/README.txt
          zip -r Viju_Trade_PC_Agent_V6_7.zip Viju_Trade_PC_Agent_V6_7

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Viju_Trade_PC_Agent_V6_7
          path: Viju_Trade_PC_Agent_V6_7.zip
